<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ants Hunt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 大厅 -->
  <div id="lobby" class="screen">

    <!-- 房间浏览视图 -->
    <div id="browserView" class="panel wide-panel">
      <h1>Ants Hunt</h1>
      <p class="subtitle">Ants Hunt · 非对称社交推理</p>

      <div class="name-row">
        <input id="nameInput" maxlength="16" placeholder="输入昵称" />
        <input id="roomNameInput" maxlength="24" placeholder="自定义房间名（可选）" />
      </div>

      <div class="create-section">
        <button id="createRoomBtn">创建房间</button>
      </div>

      <!-- 房间列表（服务端自动推送，无需手动刷新） -->
      <div class="section-header">
        <span class="section-title">当前房间</span>
      </div>
      <div class="room-list-wrap">
        <div class="room-list-head">
          <span class="col-name">房间</span>
          <span class="col-host">房主</span>
          <span class="col-count">人数</span>
          <span class="col-state">状态</span>
          <span class="col-action"></span>
        </div>
        <div id="roomList" class="room-list">
          <p class="empty-hint">暂无房间，创建一个吧</p>
        </div>
      </div>

    </div>

    <!-- 房间内视图 -->
    <div id="roomView" class="panel wide-panel hidden">
      <div class="room-header">
        <h2 id="roomTitle">房间</h2>
      </div>

      <p id="myRoleLine"></p>

      <ul id="playerList"></ul>

      <!-- 切换角色 -->
      <div class="role-switch-row">
        <button id="switchSeekerBtn" class="role-btn seeker-btn">切换为搜寻者</button>
        <button id="switchHiderBtn" class="role-btn hider-btn">切换为隐藏者</button>
      </div>

      <div class="match-duration-row">
        <label for="matchDurationSelect">对局时长</label>
        <select id="matchDurationSelect"></select>
      </div>

      <div class="action-row">
        <button id="readyBtn">准备</button>
        <button id="startGameBtn" class="hidden" disabled>开始对局</button>
      </div>
      <div class="leave-row">
        <button id="leaveRoomBtn" type="button">← 离开</button>
      </div>
      <p id="canStartHint" class="hint"></p>
      <p class="hint">需恰好 1 名搜寻者 + 1～4 名隐藏者，所有人准备后房主可开局。隐藏者方可见队友标识色。</p>
    </div>

  </div>

  <!-- 游戏画面 -->
  <div id="game" class="screen hidden">
    <canvas id="canvas"></canvas>

    <!-- 左上角：各隐藏者获证进度（全员可见） -->
    <div id="hiderScorePanel" class="hider-score-panel hidden"></div>

    <!-- 顶部信息条 -->
    <div id="hud" class="hud">
      <div class="hud-item" id="timer">5:00</div>
      <div class="hud-item lives-hud hidden" id="livesHud">生命 3</div>
      <div class="hud-item mark-timer hidden" id="markTimer">复活 10s</div>
      <div class="hud-item" id="roleTag"></div>
    </div>

    <!-- 搜寻者工具栏 -->
    <div id="toolbar" class="toolbar hidden"></div>
    <div id="seekerHint" class="bottom-hint hidden">点击蚂蚁进行标记 · 数字键/点击使用工具</div>

    <!-- 隐藏者操作提示 -->
    <div id="hiderHint" class="bottom-hint hidden">按住鼠标左键朝鼠标方向移动 · 静止靠近食物自动拾取 · 按住空格加速冲刺 · 模仿 AI 蚂蚁别露馅</div>

    <!-- 事件提示 -->
    <div id="toast"></div>
  </div>

  <!-- 结算 -->
  <div id="endScreen" class="screen hidden">
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endReason"></p>
      <p id="endScore"></p>
      <button id="restartBtn">返回大厅</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
